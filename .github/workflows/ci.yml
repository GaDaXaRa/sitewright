name: CI

# El listón tiene que sobrevivir a un push venga de quien venga, incluido un agente que
# no haya leído CLAUDE.md. Lo que aquí falla no llega a main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Núcleo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Once segundos en ocho núcleos: barato para vigilar cada push, y el listón ya ha
      # derivado dos veces sin que nadie se diera cuenta.
      - run: npm run test:mutacion
      - run: npm run build

  generator:
    name: Generador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # El generador mide colores con el núcleo —la tinta de un botón y la de cada color
      # propio salen de ahí—, así que sus escritores no se pueden ni importar sin `dist`.
      # Este trabajo no lo construía, y no se notaba porque sus pruebas no llegaban a
      # tocarlo: al partir `generate.js` y empezar a probar los escritores, sí.
      - run: npm ci --prefix core && npm run build --prefix core
      # Con el directorio a secas, Node intenta cargarlo como módulo.
      - run: node --test generator/*.test.js
      # `drift.mjs` decide si `sync-site` copia encima de una web viva: es el fichero que
      # puede borrar el trabajo de alguien, y hasta ahora no lo probaba nada.
      - run: node --test scripts/*.test.js
      # `provision.js` sólo imprime, y por eso nadie lo ejecutaba: se rompió con una
      # comilla invertida dentro de una plantilla literal y se subió roto.
      - run: |
          for bp in generator/blueprints/*.json; do
            node generator/provision.js "$bp" > /dev/null
          done

  template:
    name: Plantilla
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: template/package-lock.json
      - run: npm ci
      # Los tipos de Payload no están versionados —los genera cada sitio— así que aquí
      # hay que escribirlos antes de comprobarlos. No hace falta base de datos: sólo se
      # lee la configuración. La copia local de cada quien se queda atrás cuando alguien
      # añade un campo, y entonces miente en las dos direcciones.
      - run: npm run generate:types
        env:
          DATABASE_URI: postgres://localhost:5432/ninguna
          PAYLOAD_SECRET: ci
      - run: npm run typecheck
      # La plantilla no tiene migraciones, así que aquí el guion se salta la comparación:
      # lo que comprueba esta línea es que arranca y no se ha quedado colgado de una tripa
      # de Payload que cambió de sitio.
      - run: npm run schema:check
        env:
          DATABASE_URL: postgres://localhost:5432/ninguna
          PAYLOAD_SECRET: ci
      - run: npm run test:int

  site:
    name: Un sitio generado (${{ matrix.blueprint }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ejemplo-completo` enciende los once módulos, y está por eso: con sólo la
        # asociación, cuatro de ellos —about, media, partners, reviews— no los compilaba
        # nadie, y una errata en cualquiera la habría descubierto un cliente. Los otros dos
        # son combinaciones reales, que es lo que cambia el cableado: un catálogo con
        # precios enlaza su JSON-LD y sin ellos no, y sólo `media` pone el consentimiento
        # de los reproductores en el layout.
        blueprint: [ejemplo-completo, ejemplo-asociacion, ejemplo-portafolio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Los módulos no se compilan en ningún sitio: sólo existen dentro de una web
      # generada. Sin este trabajo, una errata en un módulo la descubre el cliente.
      - run: npm ci --prefix core && npm run build --prefix core
      # `--core file:` apunta al núcleo que se acaba de construir, no al publicado. Sin
      # esto el trabajo compilaba el núcleo local para nada y luego se instalaba el del
      # registro: probaba una mezcla que no es ningún commit, y se caía entero en cuanto
      # se subía la versión antes de publicarla.
      - run: node generator/generate.js --blueprint generator/blueprints/${{ matrix.blueprint }}.json --out /tmp/sitio --core file:$GITHUB_WORKSPACE/core
      - run: npm install --no-audit --no-fund
        working-directory: /tmp/sitio
      - run: npm run generate:types
        working-directory: /tmp/sitio
        env:
          DATABASE_URI: postgres://localhost:5432/ninguna
          PAYLOAD_SECRET: ci
      - run: npm run typecheck
        working-directory: /tmp/sitio
      - run: npm run test:int
        working-directory: /tmp/sitio
