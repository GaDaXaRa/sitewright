name: Auditoría

# La web se despliega sola con cada push, así que ya nadie ejecuta la auditoría a mano.
# Esta se lanza contra la dirección que acaba de quedar en producción: si el despliegue
# salió roto, el aviso llega sin que nadie se acuerde de mirar.
on:
  deployment_status:

jobs:
  audit:
    name: La web en producción
    if: >
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment_status.environment == 'Production' ||
       github.event.deployment_status.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Auditar
        env:
          # El dominio propio cuando lo hay; si aún no se ha comprado, la dirección que
          # Vercel acaba de publicar. Se define con `gh variable set AUDIT_URL`.
          URL: ${{ vars.AUDIT_URL || github.event.deployment_status.environment_url }}
          # Un rol de Postgres que sólo puede leer `payload_migrations`: ni los ajustes del
          # sitio, ni borrar, ni crear nada. Con él, la puerta del esquema mira la base de
          # producción de verdad; sin secreto, se salta como hasta ahora. Se crea con SQL
          # corriente, porque un rol hecho con `neonctl roles create` nace dentro de
          # `neon_superuser` y el dueño de la base no puede sacarlo de ahí.
          AUDIT_DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['sitewright-core'].replace(/[^0-9.]/g, '')")
          # `-p pg` no es un capricho: la auditoría corre sobre el repositorio pelado, sin
          # `npm ci`, así que el cliente de Postgres no está por ninguna parte y la puerta
          # del esquema se saltaba diciendo «no está instalado pg». npx los pone a los dos
          # en la misma carpeta y el núcleo lo encuentra.
          npx --yes -p "sitewright-core@$VERSION" -p pg sitewright-audit \
            --url "$URL" \
            --css "src/app/(frontend)/styles.css" \
            --migrations src/migrations
